# Package of a release: on a release tag vX.Y.Z, run the tests for the tagged commit (test.yml),
# build the sdist and the wheel, describe them with an SBOM, attest their build provenance,
# publish them to PyPI by trusted publishing and attach everything to a GitHub release.
#
# Manual fallback, should GitHub not start the workflow for a pushed tag: Actions → release →
# Run workflow, "Use workflow from" the tag and the same tag as input `tag`. Anything else is
# refused (job `tag`): the run must be on the tag itself.
#
# Supply chain: every action is pinned to a full commit SHA (the comment names its version), the
# build tools to exact versions. PyPI receives a signed attestation of each file (PEP 740).
#
# No stored secret: OIDC tokens (id-token: write) for PyPI and the attestations, and the
# workflow's own token for the GitHub release. The trusted publisher on PyPI names this file and
# the environment `pypi`; renaming either stops the upload.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag vX.Y.Z (choose the same tag under \"Use workflow from\")"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Existing release tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is not a release tag vX.Y.Z" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "run this workflow from the tag $TAG (\"Use workflow from\" → Tags → $TAG), not from $GITHUB_REF" >&2
            exit 1
          fi

  test:
    needs: tag
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}  # the release tag (job `tag`)
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --disable-pip-version-check "build==1.6.1" "cyclonedx-bom==7.6.0"
          python -m build
          version="$(ls dist/*.whl | sed -E 's/.*-([0-9]+\.[0-9]+\.[0-9]+)-.*/\1/')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the package version is $version, the tag says $GITHUB_REF_NAME" >&2
            exit 1
          fi
          mkdir sbom
          cyclonedx-py requirements requirements.txt --output-file sbom/einvoice-xml.cdx.json

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@aef6c9b6e301dc803e1bc9133e9ce67ae9b0906b # v1.14.3
        with:
          attestations: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes artifacts/dist/* artifacts/sbom/*
